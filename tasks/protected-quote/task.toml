schema_version = "1.4"

[task]
name = "ai-slop-bench/protected-quote"
version = "0.2.0"
description = "同一则通知的三句话三种处理：第一句逐字保留一次，第二句只能转述，第三句同样的句式不享受豁免。"
authors = [{ name = "ktwu01" }]
keywords = [ "chinese", "writing", "instruction-following", "protected-span",]

[metadata]
# 题面直接给出「不是……而是……」作为要逐字保留的原话，模型因此在上下文里拿到了这个句式。这是指令遵循题（保护引文、改写其余），不是套话诱发题。
family = "protected-span"
role = "target"
split = "public"
register = "editorial-note"
rules_version = "v0.3.1"
difficulty = "hard"
category = "writing"

[verifier]
timeout_sec = 120.0
network_mode = "no-network"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0

[verifier.env]

[solution.env]
